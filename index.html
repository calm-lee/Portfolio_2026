    <script>
      // Restore path encoded by 404.html redirect
      (function () {
        var p = window.location.search.slice(1);
        if (p.indexOf("p=/") === 0) {
          var path = p.slice(3).split("&")[0].replace(/~and~/g, "&");
          var rest = p.slice(3 + path.length);
          var query =
            rest.indexOf("&q=") === 0
              ? "?" + rest.slice(3).replace(/~and~/g, "&")
              : "";
          window.history.replaceState(
            null,
            null,
            "/Portfolio_2026/" + path + query + window.location.hash,
          );
        }
      })();
    </script>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      #root {
        height: 100%;
      }
    </style>
